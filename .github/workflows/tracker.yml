name: GitHub Projects Automation

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  move-issue-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect merged pull request
        run: |
          echo "Pull request was merged."
          echo "PR title: ${{ github.event.pull_request.title }}"
          echo "PR body: ${{ github.event.pull_request.body }}"

      - name: Add completion comment to linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || "";
            const issueMatch = prBody.match(/(?:Closes|Fixes|Resolves)\s+#(\d+)/i);

            if (!issueMatch) {
              core.info("No linked issue found in PR body.");
              return;
            }

            const issueNumber = parseInt(issueMatch[1]);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "This issue has been completed because the linked pull request was merged."
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ["Done"]
            });

            core.info(`Issue #${issueNumber} marked as Done.`);
